<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMO EXAM — Мануалы сборки стенда</title>
<style>
:root{
  --bg:#070a0f;
  --bg2:#0b1017;
  --surface:#101822;
  --surface2:#151f2b;
  --surface3:#1b2735;
  --border:#1e2b3a;
  --border2:#2a3b50;
  --text:#dbe5f0;
  --muted:#7b8ea3;
  --accent:#37d67a;
  --accent-dim:rgba(55,214,122,.12);
  --accent2:#4aa8ff;
  --warn:#ffb454;
  --danger:#ff5f6d;
  --radius:14px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(900px 500px at 12% -10%, rgba(55,214,122,.09), transparent 60%),
    radial-gradient(800px 500px at 95% 0%, rgba(74,168,255,.08), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',Arial,sans-serif;
  font-size:15px;line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(55,214,122,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:#233247;border-radius:8px;border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:#2f4considered}
::-webkit-scrollbar-thumb:hover{background:#2f445e}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:16px;
  padding:0 22px;height:62px;
  background:rgba(9,13,19,.82);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;flex-shrink:0}
.brand .logo{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-weight:800;color:#04121a;font-size:14px;
  box-shadow:0 0 18px rgba(55,214,122,.35);
}
.brand .name{font-weight:700;letter-spacing:.4px;font-size:15px}
.brand .name span{color:var(--accent)}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.crumbs b{color:var(--text);font-weight:600}
.crumbs .sep{opacity:.4}
.crumbs .lnk{cursor:pointer;transition:.15s}
.crumbs .lnk:hover{color:var(--accent)}
.btn{
  border:1px solid var(--border2);background:var(--surface2);color:var(--text);
  padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:.16s;font-family:inherit;
}
.btn:hover{background:var(--surface3);border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04121a}
.btn.primary:hover{background:#4ae88c;color:#04121a}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface2);border-color:var(--border2);color:var(--text)}

/* ---------- LAYOUT ---------- */
#app{max-width:1180px;margin:0 auto;padding:34px 22px 90px}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- HERO ---------- */
.hero{text-align:center;padding:34px 10px 44px}
.hero .pill{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--border2);background:var(--surface);
  color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;
  padding:6px 14px;border-radius:100px;margin-bottom:22px;
}
.hero .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{
  font-size:clamp(30px,5vw,50px);line-height:1.1;font-weight:800;letter-spacing:-1px;margin-bottom:16px;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(120deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{color:var(--muted);max-width:640px;margin:0 auto;font-size:16px}

/* ---------- MODULE CARDS ---------- */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:8px}
.card{
  position:relative;background:linear-gradient(170deg,var(--surface),var(--bg2));
  border:1px solid var(--border);border-radius:var(--radius);
  padding:26px 24px;cursor:pointer;transition:.22s;overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:var(--radius);
  background:radial-gradient(400px 200px at 50% -20%,rgba(55,214,122,.16),transparent 70%);
  opacity:0;transition:.25s;
}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 18px 40px -20px rgba(55,214,122,.5)}
.card:hover::before{opacity:1}
.card.locked{cursor:not-allowed;opacity:.55}
.card.locked:hover{transform:none;border-color:var(--border);box-shadow:none}
.card.locked:hover::before{opacity:0}
.card .num{
  font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:2px;font-weight:700;margin-bottom:14px;
}
.card.locked .num{color:var(--muted)}
.card h3{font-size:21px;font-weight:700;margin-bottom:10px;letter-spacing:-.3px}
.card p{color:var(--muted);font-size:14px;line-height:1.55;min-height:44px}
.card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{
  font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:6px;
  background:var(--surface3);border:1px solid var(--border2);color:var(--muted);font-weight:600;
}
.tag.on{background:var(--accent-dim);border-color:rgba(55,214,122,.4);color:var(--accent)}
.tag.soon{background:rgba(255,180,84,.1);border-color:rgba(255,180,84,.3);color:var(--warn)}
.arrow{color:var(--muted);font-size:18px;transition:.2s}
.card:hover .arrow{color:var(--accent);transform:translateX(4px)}
.card.locked:hover .arrow{color:var(--muted);transform:none}

/* ---------- EDITION ---------- */
.section-head{margin:6px 0 26px}
.section-head .kicker{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:700;margin-bottom:10px;text-transform:uppercase}
.section-head h2{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-bottom:8px}
.section-head p{color:var(--muted);max-width:720px}

.edition-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.edition{
  position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px;cursor:pointer;transition:.22s;
}
.edition:hover{border-color:var(--accent2);transform:translateY(-3px);box-shadow:0 18px 40px -22px rgba(74,168,255,.6)}
.edition.ai:hover{border-color:var(--accent);box-shadow:0 18px 40px -22px rgba(55,214,122,.6)}
.edition .badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1px;
  padding:4px 10px;border-radius:6px;margin-bottom:16px;font-family:var(--mono);
}
.badge.green{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(55,214,122,.35)}
.badge.blue{background:rgba(74,168,255,.12);color:var(--accent2);border:1px solid rgba(74,168,255,.35)}
.edition h3{font-size:19px;font-weight:700;margin-bottom:8px}
.edition p{color:var(--muted);font-size:13.5px;min-height:40px}
.edition ul{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:7px}
.edition li{font-size:13px;color:var(--muted);display:flex;gap:9px;align-items:flex-start}
.edition li::before{content:'▸';color:var(--accent);flex-shrink:0}
.edition.blue li::before{color:var(--accent2)}

/* ---------- MANUAL ---------- */
.manual{display:grid;grid-template-columns:246px 1fr;gap:34px;align-items:start}
.toc{position:sticky;top:86px;max-height:calc(100vh - 110px);overflow-y:auto;padding-right:6px}
.toc h4{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-family:var(--mono)}
.toc a{
  display:block;padding:8px 12px;border-radius:9px;color:var(--muted);text-decoration:none;
  font-size:13px;border-left:2px solid transparent;transition:.15s;margin-bottom:2px;
}
.toc a:hover{color:var(--text);background:var(--surface)}
.toc a.active{color:var(--accent);background:var(--accent-dim);border-left-color:var(--accent);font-weight:600}

.content{min-width:0}
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:26px 26px 22px;margin-bottom:22px;scroll-margin-top:84px;
}
.panel h2{
  font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:16px;
  display:flex;align-items:center;gap:12px;
}
.panel h2 .idx{
  font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);
  background:var(--accent-dim);border:1px solid rgba(55,214,122,.3);
  padding:3px 9px;border-radius:7px;flex-shrink:0;
}
.panel h3{font-size:15px;font-weight:700;margin:22px 0 10px;color:var(--accent2);display:flex;align-items:center;gap:8px}
.panel h3::before{content:'';width:3px;height:15px;background:var(--accent2);border-radius:2px}
.panel p{margin-bottom:12px;color:#c3d0de;font-size:14.5px}
.panel ul,.panel ol{margin:0 0 14px 20px;color:#c3d0de;font-size:14.5px}
.panel li{margin-bottom:6px}
.note{
  border-left:3px solid var(--accent);background:var(--accent-dim);
  padding:13px 16px;border-radius:0 10px 10px 0;margin:16px 0;font-size:13.5px;color:#b7c8d8;
}
.note strong{color:var(--accent)}
.note.blue{border-left-color:var(--accent2);background:rgba(74,168,255,.09)}
.note.blue strong{color:var(--accent2)}

/* ---------- CODE ---------- */
.codeblock{
  background:#05080d;border:1px solid var(--border);border-radius:12px;
  overflow:hidden;margin:14px 0 18px;
}
.cb-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--border);
}
.cb-lang{font-family:var(--mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.cb-copy{
  background:transparent;border:1px solid var(--border2);color:var(--muted);
  font-size:11px;font-weight:600;padding:4px 11px;border-radius:7px;cursor:pointer;
  font-family:inherit;transition:.15s;
}
.cb-copy:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.cb-copy.done{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.codeblock pre{
  padding:15px 17px;overflow-x:auto;font-family:var(--mono);font-size:13px;
  line-height:1.72;color:#cfe6d8;white-space:pre;tab-size:2;
}
.codeblock pre .v{color:var(--accent);font-weight:600;background:rgba(55,214,122,.09);border-radius:3px;padding:0 2px}

/* ---------- TABLE ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;margin:14px 0}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-family:var(--mono);min-width:820px}
table.tbl th{
  background:var(--surface2);color:var(--accent);text-align:left;padding:11px 12px;
  font-weight:700;font-size:11px;letter-spacing:.8px;text-transform:uppercase;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
table.tbl td{padding:9px 12px;border-bottom:1px solid rgba(30,43,58,.6);color:#b9c8d8;white-space:nowrap}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:rgba(55,214,122,.04)}
table.tbl td:first-child{color:var(--text);font-weight:700}
table.tbl td .v{color:var(--accent)}

/* ---------- HUMAN FILES ---------- */
.filetabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filetabs button{
  font-family:var(--mono);font-size:12px;font-weight:600;
  background:var(--surface);border:1px solid var(--border);color:var(--muted);
  padding:8px 13px;border-radius:9px;cursor:pointer;transition:.16s;
}
.filetabs button:hover{color:var(--text);border-color:var(--border2)}
.filetabs button.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}

/* ---------- DRAWER ---------- */
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:.25s;z-index:80;
}
#overlay.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;right:0;height:100vh;width:min(430px,92vw);z-index:90;
  background:var(--bg2);border-left:1px solid var(--border);
  transform:translateX(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
#drawer.on{transform:none}
.dr-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.dr-head h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px}
.dr-head h3 span{font-size:11px;font-family:var(--mono);color:var(--accent);background:var(--accent-dim);padding:2px 8px;border-radius:6px;border:1px solid rgba(55,214,122,.3)}
.dr-body{flex:1;overflow-y:auto;padding:16px 20px 26px}
.dr-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0}
.dr-foot .btn{flex:1;justify-content:center}

.fgroup{border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.fgroup>summary{
  list-style:none;cursor:pointer;padding:13px 16px;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface2);user-select:none;
}
.fgroup>summary::-webkit-details-marker{display:none}
.fgroup>summary::after{content:'▾';color:var(--muted);transition:.2s;font-size:12px}
.fgroup[open]>summary::after{transform:rotate(180deg)}
.fgroup[open]>summary{color:var(--accent);border-bottom:1px solid var(--border)}
.fields{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.field input{
  background:#05080d;border:1px solid var(--border2);border-radius:9px;
  padding:9px 12px;color:var(--accent);font-family:var(--mono);font-size:13px;
  outline:none;transition:.16s;width:100%;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(55,214,122,.14)}
.field input:hover{border-color:#33475f}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:14px;opacity:.4}

.footer{
  text-align:center;color:var(--muted);font-size:12.5px;
  padding:34px 20px 0;border-top:1px solid var(--border);margin-top:50px;
}
.footer code{font-family:var(--mono);color:var(--accent);font-size:12px}

@media(max-width:900px){
  .manual{grid-template-columns:1fr;gap:18px}
  .toc{position:static;max-height:none;display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
  .toc h4{display:none}
  .toc a{white-space:nowrap;border-left:none;border-bottom:2px solid transparent}
  .toc a.active{border-left:none;border-bottom-color:var(--accent)}
}
@media(max-width:620px){
  #app{padding:22px 14px 70px}
  .topbar{padding:0 14px;gap:10px}
  .brand .name{display:none}
  .panel{padding:20px 16px}
  .hero{padding:20px 0 32px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" onclick="go('home')">
    <div class="logo">DE</div>
    <div class="name">DEMO<span>EXAM</span></div>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <button class="btn" id="settingsBtn" onclick="openDrawer()">⚙ Параметры</button>
</div>

<div id="app"></div>

<div id="overlay" onclick="closeDrawer()"></div>
<aside id="drawer">
  <div class="dr-head">
    <h3>Параметры стенда <span>LIVE</span></h3>
    <button class="btn ghost" onclick="closeDrawer()">✕</button>
  </div>
  <div class="dr-body" id="drawerBody"></div>
  <div class="dr-foot">
    <button class="btn" onclick="resetCfg()">Сбросить</button>
    <button class="btn primary" onclick="closeDrawer()">Готово</button>
  </div>
</aside>

let cfg = {};
function defaultCfg(){
  const o={};
  FIELDS.forEach(g=>g.items.forEach(i=>o[i.k]=i.d));
  return o;
}
function loadCfg(){
  try{
    const s = localStorage.getItem('de_cfg');
    cfg = s ? Object.assign(defaultCfg(), JSON.parse(s)) : defaultCfg();
  }catch(e){ cfg = defaultCfg(); }
}
function saveCfg(){ try{ localStorage.setItem('de_cfg', JSON.stringify(cfg)); }catch(e){} }
function resetCfg(){ cfg = defaultCfg(); saveCfg(); buildDrawer(); render(); toastReset(); }
function toastReset(){
  const b = document.getElementById('settingsBtn');
  const t = b.textContent; b.textContent='✓ Сброшено';
  setTimeout(()=>b.textContent=t,1100);
}

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function maskToDotted(p){
  p = parseInt(p,10);
  if(isNaN(p)||p<0||p>32) return '—';
  const m=[0,0,0,0];
  for(let i=0;i<p;i++) m[Math.floor(i/8)] |= (128>>(i%8));
  return m.join('.');
}
function dedent(str){
  const lines = str.replace(/^\n/,'').replace(/\s+$/,'').split('\n');
  const ind = lines.filter(l=>l.trim()).map(l=>l.match(/^ */)[0].length);
  const min = ind.length ? Math.min(...ind) : 0;
  return lines.map(l=>l.slice(min)).join('\n');
}
function code(lang, text){
  return '<div class="codeblock"><div class="cb-head"><span class="cb-lang">'+lang+
         '</span><button class="cb-copy">Копировать</button></div><pre>'+dedent(text)+'</pre></div>';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function applyVars(html){
  html = html.replace(/\{\{MASK\(([A-Z0-9_]+)\)\}\}/g, (m,k)=> maskToDotted(cfg[k]));
  html = html.replace(/\{\{([A-Z0-9_]+)\}\}/g, (m,k)=>{
    if(cfg[k]===undefined) return m;
    return '<span class="v">'+esc(cfg[k])+'</span>';
  });
  return html;
}

    ['ISP','ens3','DHCP','—','—','—','В сторону Интернет'],

    ['ISP', c.ISP_BR_IF, c.ISP_BR_IP+'/'+c.ISP_BR_MASK, maskToDotted(c.ISP_BR_MASK),'—','—','В сторону BR-RTR'],

    ['HQ-RTR','vl100', c.HQ_SRV_GW+'/'+c.HQ_SRV_MASK, maskToDotted(c.HQ_SRV_MASK),'—','100','Шлюз для HQ-SRV'],
    ['HQ-RTR','vl200', c.HQ_CLI_GW+'/'+c.HQ_CLI_MASK, maskToDotted(c.HQ_CLI_MASK),'—','200','Шлюз для HQ-CLI'],
    ['HQ-RTR','vl999', c.HQ_MGMT_GW+'/'+c.HQ_MGMT_MASK, maskToDotted(c.HQ_MGMT_MASK),'—','999','Управление'],
    ['HQ-RTR','tunnel.0', c.TUN_HQ_IP+'/30', maskToDotted(30),'—','—','GRE-туннель'],
    ['BR-RTR', c.HQ_RTR_ISP_IF, c.BR_RTR_ISP_IP+'/'+c.BR_RTR_ISP_MASK, maskToDotted(c.BR_RTR_ISP_MASK), c.ISP_BR_IP,'—','В сторону ISP'],
    ['BR-RTR','fw', c.BR_RTR_FW_IP+'/'+c.BR_FW_MASK, maskToDotted(c.BR_FW_MASK),'—','—','В сторону BR-FW'],
    ['BR-RTR','tunnel.0', c.TUN_BR_IP+'/30', maskToDotted(30),'—','—','GRE-туннель'],
    ['BR-FW','oif0', c.BR_FW_OIF_IP+'/'+c.BR_FW_MASK, maskToDotted(c.BR_FW_MASK), c.BR_RTR_FW_IP,'—','В сторону BR-RTR'],
    ['BR-FW','iif0', c.BR_FW_IIF_IP+'/'+c.BR_LAN_MASK, maskToDotted(c.BR_LAN_MASK),'—','—','В сторону BR-SRV'],
    ['HQ-SRV','ens3', c.HQ_SRV_IP+'/'+c.HQ_SRV_MASK, maskToDotted(c.HQ_SRV_MASK), c.HQ_SRV_GW,'100','DNS-сервер'],
    ['BR-SRV','ens3', c.BR_SRV_IP+'/'+c.BR_LAN_MASK, maskToDotted(c.BR_LAN_MASK), c.BR_SRV_GW,'—','—'],
    ['HQ-CLI','ens3','DHCP','—', c.HQ_CLI_GW,'200','DNS: '+c.HQ_SRV_IP],
    ['HQ-SW','—','—','—','—','—','Виртуальный коммутатор'],
  ];
  let h = '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    '<th>Устройство</th><th>Интерфейс</th><th>IP-адрес</th><th>Маска</th><th>Шлюз</th><th>VLAN</th><th>Примечание</th>'+
    '</tr></thead><tbody>';
  rows.forEach(r=>{
    h += '<tr>' + r.map((cell,i)=> i===0 ? '<td>'+esc(cell)+'</td>'
        : '<td><span class="v">'+esc(cell)+'</span></td>').join('') + '</tr>';
  });

}

let state = { view:'home', edition:null, file:'f1' };

function go(view, opts={}){
  state.view = view;
  Object.assign(state, opts);
  render();
  if(view!=='home') window.scrollTo({top:0,behavior:'instant'});
}

function setCrumbs(html){ document.getElementById('crumbs').innerHTML = html; }

/* ============================================================
   РЕНДЕР
   ============================================================ */
function render(){
  const app = document.getElementById('app');

  if(state.view==='home'){
    setCrumbs('<span>Модули</span>');
    app.innerHTML = homeView();
    return;
  }

  if(state.view==='module1'){
    setCrumbs('<span class="lnk" onclick="go(\'home\')">Модули</span><span class="sep">/</span><b>Модуль 1</b>');
    app.innerHTML = module1View();
    return;
  }

  if(state.view==='manual'){
    const isAI = state.edition==='ai';
    setCrumbs(
      '<span class="lnk" onclick="go(\'home\')">Модули</span><span class="sep">/</span>' +
      '<span class="lnk" onclick="go(\'module1\')">Модуль 1</span><span class="sep">/</span>' +
      '<b>' + (isAI ? 'AI настройка' : 'HUMAN настройка') + '</b>'
    );
    app.innerHTML = isAI ? manualAIView() : manualHumanView();
    if(isAI) attachTocObserver();
    return;
  }
}

/* ---------- TOC ACTIVE STATE ---------- */
function attachTocObserver(){
  const links = document.querySelectorAll('.toc a');
  const panels = document.querySelectorAll('.panel');
  if(!links.length) return;
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        links.forEach(l=>l.classList.toggle('active', l.dataset.t === e.target.id));
      }
    });
  }, { rootMargin:'-90px 0px -70% 0px', threshold:0 });
  panels.forEach(p=>obs.observe(p));
  if(links[0]) links[0].classList.add('active');
}

/* ============================================================
   DRAWER
   ============================================================ */
function buildDrawer(){
  const body = document.getElementById('drawerBody');
  body.innerHTML = FIELDS.map(g=>`
    <details class="fgroup" ${g.open?'open':''}>
      <summary>${g.group}</summary>
      <div class="fields">
        ${g.items.map(i=>`
          <div class="field">
            <label for="f_${i.k}">${i.l}</label>
            <input id="f_${i.k}" data-k="${i.k}" value="${esc(cfg[i.k])}" spellcheck="false" autocomplete="off">
          </div>`).join('')}
      </div>
    </details>
  `).join('');

  body.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      cfg[inp.dataset.k] = inp.value;
      saveCfg();
      render();
    });
  });
}
function openDrawer(){
  document.getElementById('drawer').classList.add('on');
  document.getElementById('overlay').classList.add('on');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('overlay').classList.remove('on');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

/* ============================================================
   COPY BUTTONS
   ============================================================ */
document.addEventListener('click', e=>{
  const btn = e.target.closest('.cb-copy');
  if(!btn) return;
  const pre = btn.closest('.codeblock').querySelector('pre');
  const text = pre.innerText;
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent = '✓ Скопировано';
    btn.classList.add('done');
    setTimeout(()=>{ btn.textContent='Копировать'; btn.classList.remove('done'); }, 1400);
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    btn.textContent = '✓ Скопировано';
    setTimeout(()=>{ btn.textContent='Копировать'; }, 1400);
  });
});

/* ============================================================
   INIT
   ============================================================ */
loadCfg();
buildDrawer();
render();
